{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Edit Venue</h2>
    <form method="post" class="mb-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'manage_sites' %}" class="btn btn-secondary ml-2">Cancel</a>
    </form>
</div>
{% endblock %}
