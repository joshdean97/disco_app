{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/register.css' %}">
<div class="register-container">
    <h1>Create Account</h1>
    
    <form method="post" action="{% url 'register' %}" class="register-form" novalidate>
        {% csrf_token %}
        
        <div class="form-group">
            <label for="user_type">Account Type:</label>
            <select name="user_type" id="user_type" required onchange="toggleFormType(this.value)" data-user-type="{{ user_type|default:'' }}">
                <option value="">Select account type</option>
                <option value="staff" {% if user_type == 'staff' %}selected{% endif %}>Staff Member</option>
                <option value="operator" {% if user_type == 'operator' %}selected{% endif %}>Operator</option>
            </select>
        </div>

        <div id="staff-form" class="form-section" style="display:none;">
            <h2>Staff Registration</h2>
            {{ staff_form.as_p }}
        </div>

        <div id="operator-form" class="form-section" style="display:none;">
            <h2>Operator Registration</h2>
            {{ operator_form.as_p }}
        </div>

        <button type="submit" class="btn-primary">Register</button>
    </form>

    <p>Already have an account? <a href="/login">Login here</a></p>
</div>

<script src="{% static 'js/register.js' %}"></script>
{% endblock %}
