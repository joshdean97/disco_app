{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
    <h1 style="text-align: center; margin-bottom: 30px; color: #1a1a1a;">Login</h1>
    
    <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
        {% csrf_token %}
        
        <div>
            <label for="email" style="display: block; margin-bottom: 5px; font-weight: 500;">Email</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                required 
                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;"
            >
        </div>
        
        <div>
            <label for="password" style="display: block; margin-bottom: 5px; font-weight: 500;">Password</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                required 
                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;"
            >
        </div>
        
        <button 
            type="submit" 
            style="padding: 10px; background-color: #00d4ff; color: #1a1a1a; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: background-color 0.3s;"
            onmouseover="this.style.backgroundColor='#00b8d4'"
            onmouseout="this.style.backgroundColor='#00d4ff'"
        >
            Login
        </button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; color: #666;">
        Don't have an account? <a href="/register" style="color: #00d4ff; text-decoration: none;">Register here</a>
    </p>
</div>
{% endblock %}
